<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="badgeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15375E"/>
      <stop offset="100%" stop-color="#0B2038"/>
    </linearGradient>
    <linearGradient id="needleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C878"/>
      <stop offset="100%" stop-color="#B8903F"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#badgeFill)"/>
  <rect x="7" y="7" width="498" height="498" rx="108" fill="none" stroke="#2A4D73" stroke-width="2"/>

  <!-- compass ring -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="#C9A961" stroke-width="10" opacity="0.9"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#C9A961" stroke-width="2" opacity="0.35"/>

  <!-- cardinal ticks -->
  <g fill="#C9A961" opacity="0.8">
    <rect x="251" y="84" width="10" height="26" rx="2"/>
    <rect x="251" y="402" width="10" height="26" rx="2"/>
    <rect x="84" y="251" width="26" height="10" rx="2"/>
    <rect x="402" y="251" width="26" height="10" rx="2"/>
  </g>

  <!-- compass needle, pointing northeast -->
  <g transform="translate(256,256) rotate(-38)">
    <polygon points="0,-104 26,0 -26,0" fill="url(#needleGold)"/>
    <polygon points="0,104 26,0 -26,0" fill="#F4F0E6"/>
  </g>
  <circle cx="256" cy="256" r="12" fill="#0B2038" stroke="#C9A961" stroke-width="3"/>
</svg>
